apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-runner
  namespace: gitlab-runner
spec:
  interval: 1h
  chart:
    spec:
      chart: gitlab-runner
      version: "0.94.0"
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: gitlab
  # The runner authenticates with a group-level runner authentication token
  # held in the 'gitlab-runner-token' Secret (keys: runner-token,
  # runner-registration-token). Setting runners.secret makes the chart use that
  # Secret instead of creating its own.
  values:
    gitlabUrl: https://gitlab.com
    concurrent: 4
    checkInterval: 3
    rbac:
      create: true
      clusterWideAccess: false
    serviceAccount:
      create: true
    runners:
      executor: kubernetes
      # Tags, "run untagged jobs", and the runner name come from how the group
      # runner is created in GitLab. With a glrt- authentication token the chart
      # ignores its tag/untagged flags, so there is nothing to set here.
      secret: gitlab-runner-token
      config: |
        [[runners]]
          [runners.kubernetes]
            namespace = "gitlab-runner"
            image = "alpine"
            privileged = false
